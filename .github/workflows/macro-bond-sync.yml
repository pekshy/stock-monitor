name: macro-bond-sync

# 中债国债收益率同步（2Y/5Y/10Y/30Y + 10Y-2Y 期限利差）
# 数据源：东方财富「中美国债收益率」，原始数据来自中国债券信息网
# 说明：宏观指标由另一个任务维护，本 workflow 只负责国债收益率这一块，
#       若该任务已覆盖，可直接删除本文件。

on:
  workflow_dispatch:
  schedule:
    # 北京时间 08:30（UTC 00:30），工作日运行，抓取前一交易日收盘数据
    - cron: '30 0 * * 1-5'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch China treasury yields
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/macro-sync/fetch_cn_bond.py --years 1
