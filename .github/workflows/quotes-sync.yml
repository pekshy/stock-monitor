name: quotes-sync

# 研究池上市公司 · 行情与估值同步（独立于行情板块的 daily_quotes）
# 数据源：腾讯财经（A股/港股/美股/日股）+ yfinance（台股/欧股）
# 写入：research_quotes / research_quote_runs
# 依赖 Secrets：SUPABASE_URL、SUPABASE_SERVICE_KEY（无需 Tushare token）
# 触发：仅 workflow_dispatch（手动界面 / gh CLI / 外部调度工具调 REST API）
#       本工作流不设 schedule，不自动运行。

on:
  workflow_dispatch:
    inputs:
      market:
        description: '抓取范围（cn,hk,us,jp,yf 逗号分隔）'
        default: 'cn,hk,us,jp,yf'
        type: string
      limit:
        description: '每类最多抓多少只（0=全部）'
        default: '0'
        type: string
      dry_run:
        description: '只预览不写库'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/research-quotes/requirements.txt

      - name: Check secrets
        run: |
          test -n "${{ secrets.SUPABASE_SERVICE_KEY }}" || { echo "::error::缺少 SUPABASE_SERVICE_KEY"; exit 1; }

      - name: Sync quotes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS="--market ${{ inputs.market || 'cn,hk,us,jp,yf' }}"
          [ "${{ inputs.limit || '0' }}" != "0" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          echo "python scripts/research-quotes/fetch_quotes.py $ARGS"
          python scripts/research-quotes/fetch_quotes.py $ARGS
